question: '이 후보 기사는 기업 이슈 사례 카드로 올릴 수 있는 기준을 충족하는가. 올릴 수 있는 것은 셋이다. (1) 붙은 기업 자신의
  행위나 그로 인한 논란. (2) 붙은 기업에 대한 처분, 판결, 조사, 소송. (3) 붙은 기업 사업장이나 서비스의 사고, 유출, 리콜, 산업재해.
  올릴 수 없는 것은 다섯 가지고 하나라도 걸리면 미달이다. (1) 칼럼, 사설, 기고, 인터뷰, 분석, 논평. (2) 노조나 단체의 집회, 파업,
  요구, 여론전이고 회사의 행위나 처분이 제목에 없는 것. (3) 제목의 사건 주체가 붙은 기업(브랜드와 계열 포함)이 아니라 다른 기업이거나,
  붙은 기업이 피해 기업인 것. (4) 기업명이 언급될 뿐인 정책, 업계 전망, 일정 기사. (5) 실적, 주가, 신제품, 광고성 홍보, 할인과
  이벤트, 협약 체결 발표. 예외: 이미 알려진 사건의 후속 보도(소송 진행, 처분 확정)도 붙은 기업이 주체이면 충족이다. 협력사 대금 조기 지급처럼
  금액과 대상이 제목에 있는 확정 행동도 충족이다. 같은 사건이 이미 올라 있는지, 제목이 사실인지는 보지 않는다. 입력은 [기업] 수집기가 붙인
  기업과 [제목]이다. 본문과 매체는 없고 제목만으로 판단한다.'
