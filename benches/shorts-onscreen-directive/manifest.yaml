question: '이 장면의 화면에 나가는 글에 영상을 만드는 사람에게 하는 제작 지시가 섞여 있는가. 제작 지시는 네 가지다. (1) 연출 지시.
  어떤 어조나 구성으로 열거나 닫으라는 말이다. 「단언으로 연다」 「질문으로 시작한다」 「반전으로 닫는다」가 그 예다. (2) 표현 금지나 강제.
  기호, 낱말, 말투를 쓰지 말라거나 쓰라는 말이다. 「물음표 금지」 「이모지 넣지 말 것」 「해시태그 금지」가 그 예다. (3) 장면이나 컷 지시.
  번호가 붙은 장면이나 컷을 어떻게 찍거나 배치하라는 말이다. 「장면 2에서 확대」 「컷 3은 자료화면」이 그 예다. (4) 톤 지정. 「톤은 담담하게」처럼
  영상의 어조를 지정하는 말이다. (5) 화면 구성이나 분량 지시. 무엇을 넣거나 빼라, 어디에 두라, 어느 길이로 하라는 말이다. 「로고는 끝에만」
  「자막은 두 줄 안으로」 「배경 음악 없이」가 그 예다. 예외: 시청자에게 하는 금지나 권고는 제작 지시가 아니다. 「운전 중 사용 금지」 「검사
  전 물도 금지」처럼 영상이 다루는 소재 안의 규정이나 안내가 그렇다. 「장면」 「컷」 「톤」 「연다」가 소재의 일부로 쓰인 것도 제작 지시가 아니다.
  「마지막 장면이 화제가 됐다」 「새 매장은 11월에 문을 연다」 「피부 톤 보정」이 그렇다. 가르는 값은 낱말이 아니라 그 문장을 **누구에게**
  하는가다. 시청자에게 하는 말이면 자막이고, 영상을 만드는 사람에게 하는 말이면 제작 지시다. 문체, 길이, 재미, 수치의 정확성은 보지 않는다.
  칸 이름도 보지 않는다 -- 어느 칸에 있든 화면에 나가는 글이다. 입력은 한 장면의 화면에 나가는 칸 목록이다. headline 은 큰 글씨
  제목, caption 은 작은 설명, note 는 장면 아래 한 줄, items 와 steps 는 항목 목록, quote 는 인용, ask 는
  시청자에게 던지는 물음이다. 내레이션은 주지 않는다.'
