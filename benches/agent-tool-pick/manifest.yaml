question: '이 사용자 요청을 처리하려면 에이전트가 어느 도구를 먼저 써야 하는가. 도구는 다섯이다. 웹 검색: 최신 사실, 외부 정보, 특정
  사이트 내용이 필요할 때. 계산기: 숫자 계산이나 단위 변환이 필요할 때. 캘린더: 일정 조회·등록·변경일 때. 파일 읽기: 사용자가 가진 파일이나
  문서 내용을 봐야 할 때. 도구 없음: 일반 지식, 글쓰기, 요약, 번역처럼 외부 정보 없이 답할 수 있을 때. 여러 도구가 필요해 보이면 요청이
  가장 먼저 요구하는 것을 고른다. 입력은 사용자 요청 한 문장이다.'
