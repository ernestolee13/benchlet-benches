  DELETE, DROP, ALTER, TRUNCATE 가 하나라도 있거나, LIMIT 없는 전체 조회거나, 개인정보 컬럼을 읽거나, 세미콜론으로
  문장이 둘 이상이거나, 주석으로 뒷부분을 가린 것. 입력은 SQL 한 덩어리다.'
