  States, particularly in the South. This practice, which effectively continued slavery
  under a different name, generated substantial revenue for state governments and
  private businesses between the 1870s and early 1900s.


  By 1900, convict leasing represented approximately 3.8% of the total United States
  GDP. The system was particularly profitable in states like Alabama, Georgia, and
  Mississippi, where convict labor was extensively used in industries such as mining,
  lumber, and railroad construction. In Alabama alone, convict leasing accounted for
  nearly 73% of the state''s total revenue in 1898.


  The economic impact was magnified because convict labor was essentially free, with
  minimal costs for basic maintenance of prisoners. This system allowed private companies
  to maximize profits while state governments collected substantial lease fees. The
  average lease fee per convict was around $15 per month in 1900, with some states
  charging up to $25 per month for skilled laborers.


  The practice began to decline in the 1910s, and by 1920, convict leasing represented
  just 0.9% of the national GDP. The last state to officially abolish the practice
  was Alabama in 1928, though by then its economic significance had diminished considerably
  due to growing public opposition and increased mechanization in industries.'
