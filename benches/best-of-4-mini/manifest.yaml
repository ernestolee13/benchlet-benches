  were both members of the British Medical Research Council''s Laboratory of Molecular
  Biology in Cambridge, England. They independently proposed the double helix structure
  of DNA, which is a double spiral of nucleotides that carries genetic information.


  Maurice Wilkins, a biologist, was also working on the structure of DNA at King''s
  College London. He provided crucial experimental data that supported Watson and
  Crick''s hypothesis.


  All three scientists were awarded the Nobel Peace Prize in Physiology or Medicine
  in 1962, recognizing their groundbreaking work in the discovery of the structure
  of DNA.'
- 'The Nobel Peace Prize is awarded to individuals or organizations that have made
  significant contributions to peace, such as reducing standing armies, forming peace
  unions, and promoting peace congresses. It is not awarded for scientific discoveries
  like the structure of DNA.


  However, you might be thinking of the Nobel Prize in Physiology or Medicine, which
  is awarded for discoveries in the fields of life sciences and medicine. In 1962,
  James Watson, Francis Crick, and Maurice Wilkins were awarded the Nobel Prize in
  Physiology or Medicine for their discoveries concerning the molecular structure
  of DNA, including the double helix structure. Rosalind Franklin, whose work was
  crucial to the discovery, was not included in the award as she had passed away in
  1958 and the Nobel Prize is not awarded posthumously.


  So, to answer your question, no one won the Nobel Peace Prize for the discovery
  of DNA structure. Watson, Crick, and Wilkins were awarded the Nobel Prize in Physiology
  or Medicine for their work on DNA.'
