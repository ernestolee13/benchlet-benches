  * The District Superintendent is in charge of the police force in the district and
  makes sure that they are doing their job properly.

  * He/She works under the supervision of the Collector and the state government.

  * The District Superintendent has the power to take action against people who break
  the law in the district.


  **Key differences:**


  * The Collector is the overall head of the district administration, while the District
  Superintendent is the head of the police department.

  * The Collector has more powers and responsibilities than the District Superintendent.

