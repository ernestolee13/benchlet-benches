  and vice versa. Charles'' Law illustrates that volume and temperature of a gas are
  directly proportional at constant pressure; thus, an increase in temperature results
  in an increase in volume. Gay-Lussac’s Law states that pressure and temperature
  are inversely proportional at constant volume, indicating that an increase in pressure
  leads to a decrease in temperature.


