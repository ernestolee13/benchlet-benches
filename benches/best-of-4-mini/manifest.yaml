- 'Marked linguistic features refer to characteristics of language elements that are
  considered less common, more specific, or more complex compared to their unmarked
  counterparts. In linguistics, the concept of markedness helps to explain how certain
  forms or structures are perceived as more "normal" or "neutral," while others are
  seen as "marked" or "special."


  Here are some examples to illustrate markedness:


  1. **Phonology**: In many languages, voiceless consonants (like /p/, /t/, /k/) are
  considered unmarked, while their voiced counterparts (like /b/, /d/, /g/) are marked.
  This is because voiceless consonants are often more common and occur in a wider
  variety of contexts.


  2. **Morphology**: In English, the singular form of a noun is unmarked (e.g., "cat"),
  while the plural form is marked (e.g., "cats"). The plural form is marked by the
  addition of the -s suffix, indicating that it is a derived or less basic form.


  3. **Syntax**: In many languages, the active voice is unmarked, while the passive
  voice is marked. For example, "The cat chased the mouse" (active) is unmarked, whereas
  "The mouse was chased by the cat" (passive) is marked.


