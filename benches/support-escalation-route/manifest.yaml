question: '이 고객 메시지는 어디로 보내야 하는가. 넷 중 하나다. 봇 자동응답: 영업시간·요금·비밀번호 재설정 방법·배송 조회처럼 안내문으로
  끝나는 질문. 상담사 연결: 개별 계정 조치가 필요하거나(환불·정정·계약 변경), 안내로 해결되지 않았다고 말하거나, 감정이 격앙돼 사람이 받아야
  하는 것. 긴급 대응: 안전·보안·금전 피해가 진행 중인 것(계정 도용, 결제 오류로 돈이 반복 빠짐, 서비스 전면 장애, 개인정보 노출). 무시:
  광고·스팸·서비스와 무관한 메시지. 겹치면 긴급 > 상담사 > 봇 > 무시 순. 입력은 메시지 본문이다.'
