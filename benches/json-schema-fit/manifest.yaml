question: 이 JSON 이 주어진 스키마를 위반하는가. 스키마는 필수 키 목록, 키별 타입, 허용 값(enum)으로만 적는다. 위반은 셋이다.
  (1) 필수 키가 없다. (2) 값의 타입이 다르다(정수 자리에 문자열 등). (3) 허용 값 밖의 값이다. 스키마에 없는 추가 키는 위반이 아니다.
  입력은 [스키마] 다음에 [JSON] 이다.
