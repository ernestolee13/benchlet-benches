question: '이 반반 초안의 블록1과 블록2에 검수 hard 규칙 위반이 있는가. 위반은 세 가지다. (1) 블록1에 지어낸 인물 이름이나
  실제 기업, 인물, 사건 이름이 나온다. (2) 블록1이 실화라고 주장한다. 「제 친구가」「실제로 있었던 일인데」 같은 어조가 그 예다. (3)
  블록2의 질문과 선택지가 같은 것을 묻지 않는다. 사람을 묻는 질문인데 선택지가 명제이거나, 명제를 묻는데 선택지가 사람인 경우다. 예외: 관계나
  직함으로만 부르는 것(언니, 남편, 옆 자리 승객, 팀장)은 이름이 아니다. 현재형 장면 묘사와 「있을 법하다」 같은 가정형 서술은 실화 주장이
  아니다. 사람이나 입장 두 편 중 어느 쪽이 맞는지 묻고 선택지가 각자의 입장이면 맞는 것이다. 문체, 재미, 양쪽의 균형은 보지 않는다. 입력은
  [1/3] 블록1(판단을 청하는 일화)과 [2/3] 블록2(질문과 선택지)다. 블록3은 주지 않는다.'
